[project]
name = "pdf-to-markdown"
version = "1.0.0"
description = "Convert digital PDFs to markdown with intelligent table extraction"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    "baml-py==0.218.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "numpy>=1.19.2",
    "opencv-python>=4.5.4",
    "pdf2image>=1.16.0",
    "pillow>=9.2.0",
    "pydantic>=2.10.6",
    "pytesseract>=0.3.10",
    "typing-extensions>=4.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
pdf-to-md = "pdf_to_markdown:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.black]
line-length = 100
target-version = ['py38']
